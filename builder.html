<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSDK Builder</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0a;color:#333;font:13px/1.4 monospace}
    #b{width:340px;text-align:center}
    #dz{border:2px dashed #181818;padding:40px 20px;cursor:pointer;border-radius:4px;transition:all .2s}
    #dz:hover,#dz.ov{border-color:#4ade80;color:#4ade80}
    #st{margin-top:12px;font-size:11px;color:#4ade80;display:none;white-space:pre-wrap}
    input{display:none}
  </style>
</head>
<body>
  <div id="b">
    <div id="dz">Drop mod folder here</div>
    <div id="st"></div>
  </div>
  <input type="file" id="fi" webkitdirectory>
<script>
var fi=document.getElementById('fi'),dz=document.getElementById('dz'),st=document.getElementById('st');
var MG=[0x52,0x53,0x44,0x4B,0x76,0x35];

function formatBytes(b){if(b<1024)return b+'B';if(b<1048576)return(b/1024).toFixed(1)+'KB';return(b/1048576).toFixed(1)+'MB';}

function build(entries){
  var n=entries.length;if(!n)return new Uint8Array(0);
  var hs=16,i;for(i=0;i<n;i++){hs+=entries[i].path.length+1;hs=(hs+3)&~3;hs+=28;}
  var doff=hs,inf=[];
  for(i=0;i<n;i++){
    var dl=entries[i].data.byteLength;
    inf.push({path:entries[i].path,offset:doff,size:dl,enc:0,md5:new Uint8Array(16)});
    doff+=dl;
  }
  var out=new Uint8Array(doff),dv=new DataView(out.buffer);
  out.set(MG,0);dv.setUint32(8,n,true);dv.setUint32(12,0,true);
  var p=16;
  for(i=0;i<n;i++){
    var nm=entries[i].path;
    for(var j=0;j<nm.length;j++)out[p++]=nm.charCodeAt(j)^(((i+1)*7+j)&0xFF);
    out[p++]=0;p=(p+3)&~3;
    dv.setUint32(p,inf[i].size,true);p+=4;dv.setUint32(p,inf[i].offset,true);p+=4;
    dv.setUint32(p,0,true);p+=4;p+=16;
  }
  for(i=0;i<n;i++)out.set(entries[i].data,inf[i].offset);
  return out;
}

function strip(files){
  if(!files.length)return[];
  // Find longest common parent directory
  var p=files[0].path,i;
  for(i=1;i<files.length;i++){while(p&&!files[i].path.startsWith(p))p=p.slice(0,-1);}
  var s=p.lastIndexOf('/');p=s!==-1?p.substring(0,s+1):'';
  
  var out=[];
  for(i=0;i<files.length;i++){
    var r=files[i].path.substring(p.length);
    if(r&&!r.endsWith('/'))out.push({path:r,data:files[i].data});
  }
  
  // CRITICAL FIX: If paths start with /Data/, strip it. 
  // The engine expects /Game/Game.bin, NOT /Data/Game/Game.bin
  if(out.length && out[0].path.toLowerCase().startsWith('/data/')) {
    out.forEach(function(f){ f.path = f.path.substring(5); });
  }
  return out;
}

async function process(fileEntries, label){
  st.style.display='block'; 
  var files=[];
  var skipped=0, errors=0;
  
  st.textContent='Reading files... 0/' + fileEntries.length;
  
  // Read files ONE BY ONE with try/catch to prevent OOM crashes
  for(var i=0;i<fileEntries.length;i++){
    var entry = fileEntries[i];
    // Use the path generated by our walk() function!
    var p = entry.path;
    try {
      var data = new Uint8Array(await entry.file.arrayBuffer());
      if(data.length === 0) {
        console.warn('Skipped empty file:', p);
        skipped++;
        continue;
      }
      files.push({path:p, data:data});
    } catch(e) {
      console.error('Failed to read file:', p, e.message);
      errors++;
    }
    if(i % 100 === 0) st.textContent='Reading files... '+i+'/'+fileEntries.length;
  }
  
  if(errors > 0 || skipped > 0) {
    alert('Done reading.\nErrors: '+errors+'\nSkipped empty: '+skipped+'\n\nThe RSDK might be incomplete.');
  }
  
  if(!files.length) {
    alert('No valid files found inside the folder.');
    st.style.display='none';
    return;
  }

  st.textContent='Parsing paths ('+files.length+' files)...';
  await new Promise(r=>setTimeout(r,10));
  
  var ent = strip(files);
  var totalSize = ent.reduce(function(s,f){ return s + f.data.byteLength; }, 0);
  
  st.textContent='Building RSDK...\n'+ent.length+' files, '+formatBytes(totalSize)+' total.';
  await new Promise(r=>setTimeout(r,10));
  
  var rsdk=build(ent);
  st.textContent='Success! Downloading '+formatBytes(rsdk.byteLength)+'...';
  
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([rsdk],{type:'application/octet-stream'}));
  a.download=(label||'mod')+'.rsdk';
  a.click();
  URL.revokeObjectURL(a.href);
  
  setTimeout(()=>{st.style.display='none';}, 3000);
}

dz.onclick=()=>fi.click();
fi.onchange=e=>{
  if(!fi.files.length)return;
  var files = Array.from(fi.files).map(f => ({file:f, path:f.webkitRelativePath}));
  process(files, fi.files[0].webkitRelativePath.split('/')[0]);
  fi.value='';
};
dz.ondragover=e=>e.preventDefault();
dz.ondragleave=()=>dz.classList.remove('ov');
dz.ondrop=async e=>{
  e.preventDefault();dz.classList.remove('ov');
  var items=e.dataTransfer.items;if(!items)return;
  var all=[];
  for(var i=0;i<items.length;i++){
    var en=items[i].webkitGetAsEntry&&items[i].webkitGetAsEntry();
    if(!en)continue;
    await walk(en,'',all);
  }
  if(all.length)process(all, all[0].path.split('/')[0]);
};

async function walk(en,path,out){
  if(en.isFile){
    out.push({file:await new Promise(r=>en.file(r)), path:path+en.name});
  }
  else if(en.isDirectory){
    var rd=en.createReader();
    await new Promise(r=>{
      var a=[],q=()=>rd.readEntries(b=>b.length?(a.push(...b),q()):r(a));
      q();
    });
    for(var e of a)await walk(e,path+en.name+'/',out);
  }
}
</script>
</body>
</html>
